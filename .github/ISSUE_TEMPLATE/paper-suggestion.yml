name: Suggest a paper
description: Add a paper to the next weekly digest
title: "Paper suggestion: "
labels: ["paper-suggestion"]
body:
  - type: input
    id: link
    attributes:
      label: Link or DOI
      description: A DOI, or a link to the paper on arXiv, PsyArXiv, bioRxiv or the journal's site.
      placeholder: "https://doi.org/10.1016/j.cognition.2026.105000"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's relevant (optional)
      description: Shown with the paper in the digest.
