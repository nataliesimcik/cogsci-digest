name: Weekly cognitive science digest

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:       # "Run workflow" button for manual runs

permissions:
  contents: write
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Make sure suggestion labels exist
        continue-on-error: true
        run: |
          gh label create paper-suggestion --color 2F4BD8 --description "Paper suggested for the digest" --force
          gh label create conference-suggestion --color 5E9E78 --description "Conference suggested for the deadlines panel" --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build this week's digest
        run: python digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Refresh conference deadlines
        run: python conferences.py
        continue-on-error: true      # a failed lookup never blocks the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git push

      - name: Reply to paper suggestions
        continue-on-error: true
        run: python suggestions.py close
        env:
          GITHUB_TOKEN: ${{ github.token }}
